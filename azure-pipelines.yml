trigger:
- master

pool:
  vmImage: ubuntu-latest

variables:
  # Name of your repository in ACR
  imageName: 'helloworld-nodejs-app'

steps:
- script: echo Building and pushing Docker image to Azure Container Registry...
  displayName: 'Build and Push Notice'

- task: Docker@2
  displayName: 'Build and push image to ACR'
  inputs:
    # 1. Select Azure Container Registry as the container provider type
    containerRegistry: 'acrconnection' # Replace with your Azure DevOps Service Connection name
    # 2. Set the repository name (no dockerhub username required for ACR)
    repository: '$(imageName)'
    command: 'buildAndPush'
    Dockerfile: 'helloworld-nodejs-app/Dockerfile'
    tags: |
      1.0
      latest
