trigger:
- master

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureServiceConnection: 'Azure subscription'
  resourceGroup: 'testRG'
  aksCluster: 'testCluster'
  chartPath: '$(System.DefaultWorkingDirectory)/helm-chart/helloworld'

stages:
# ==========================================
# STAGE 1: DEV
# ==========================================
- stage: DeployDev
  displayName: 'Deploy to DEV'
  jobs:
  - job: DeployDevJob
    displayName: 'Deploy to DEV Namespace'
    steps:
    - checkout: self

    - task: HelmInstaller@1
      displayName: 'Install Helm'
      inputs:
        helmVersionToInstall: 'latest'

    - task: AzureCLI@2
      displayName: 'Deploy Helm to DEV'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az aks get-credentials --resource-group $(resourceGroup) --name $(aksCluster) --overwrite-existing
          helm upgrade --install hello-world-app $(chartPath) \
            --namespace testns \
            --create-namespace \
            -f $(chartPath)/values.yaml \
            --set namespace=testns

# ==========================================
# STAGE 2: QA
# ==========================================
- stage: DeployQA
  displayName: 'Deploy to QA'
  dependsOn: DeployDev
  jobs:
  # 1. Manual Approval Step for QA
  - job: ApproveQA
    displayName: 'Approve QA Deployment'
    pool: server # Server jobs run on Azure DevOps without taking a build agent
    steps:
    - task: ManualValidation@0
      displayName: 'Manual Approval for QA'
      inputs:
        notifyUsers: 'your-email@domain.com' # Optional: Add email to notify
        instructions: 'Please validate DEV deployment and approve to proceed to QA.'
        onTimeout: 'reject'

  # 2. Deployment Step for QA (Runs after approval)
  - job: DeployQAJob
    displayName: 'Deploy to QA Namespace'
    dependsOn: ApproveQA
    steps:
    - checkout: self

    - task: HelmInstaller@1
      displayName: 'Install Helm'
      inputs:
        helmVersionToInstall: 'latest'

    - task: AzureCLI@2
      displayName: 'Deploy Helm to QA'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az aks get-credentials --resource-group $(resourceGroup) --name $(aksCluster) --overwrite-existing
          helm upgrade --install hello-world-app $(chartPath) \
            --namespace qa \
            --create-namespace \
            -f $(chartPath)/values.yaml \
            --set namespace=qa

# ==========================================
# STAGE 3: PROD
# ==========================================
- stage: DeployProd
  displayName: 'Deploy to PROD'
  dependsOn: DeployQA
  jobs:
  # 1. Manual Approval Step for PROD
  - job: ApproveProd
    displayName: 'Approve PROD Deployment'
    pool: server # Server jobs run on Azure DevOps without taking a build agent
    steps:
    - task: ManualValidation@0
      displayName: 'Manual Approval for PROD'
      inputs:
        notifyUsers: 'your-email@domain.com' # Optional: Add email to notify
        instructions: 'Please validate QA deployment and approve to proceed to Production.'
        onTimeout: 'reject'

  # 2. Deployment Step for PROD (Runs after approval)
  - job: DeployProdJob
    displayName: 'Deploy to PROD Namespace'
    dependsOn: ApproveProd
    steps:
    - checkout: self

    - task: HelmInstaller@1
      displayName: 'Install Helm'
      inputs:
        helmVersionToInstall: 'latest'

    - task: AzureCLI@2
      displayName: 'Deploy Helm to PROD'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az aks get-credentials --resource-group $(resourceGroup) --name $(aksCluster) --overwrite-existing
          helm upgrade --install hello-world-app $(chartPath) \
            --namespace prod \
            --create-namespace \
            -f $(chartPath)/values.yaml \
            --set namespace=prod
