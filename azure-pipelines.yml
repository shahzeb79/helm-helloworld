trigger:
- master

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureServiceConnection: 'Azure subscription' # Name of your Azure RM Service Connection
  resourceGroup: 'testRG'
  aksCluster: 'testCluster'
  k8sNamespace: 'testns'
  releaseName: 'hello-world-app'
  chartPath: '$(System.DefaultWorkingDirectory)/helm-charts/helloworld'

steps:
# 1. Install Helm binary on the build agent
- task: HelmInstaller@1
  displayName: 'Install Helm'
  inputs:
    helmVersionToInstall: 'latest'

# 2. Get AKS credentials and run Helm upgrade/install
- task: AzureCLI@2
  displayName: 'Deploy Helm Chart to AKS'
  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      # 1. Get credentials for AKS cluster
      az aks get-credentials --resource-group $(resourceGroup) --name $(aksCluster) --overwrite-existing
      
      # 2. Deploy or upgrade the Helm release
      helm upgrade --install $(releaseName) $(chartPath) \
        --namespace $(k8sNamespace) \
        --create-namespace \
        -f $(chartPath)/values.yaml
